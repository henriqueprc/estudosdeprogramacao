<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="estilo.css">
    <meta charset="UTF-8">

    <title>Cadastro</title>
</head>
<body>


    <div>
        <h1>Cadastro de DEVs</h1>
        <p>Complete suas informações!!</p>

        <fieldset>
          <div>
            <label>Nome</label>
            <input type="text"nome="id nome">

             <label>Sobrenome</label>
             <input type="text"nome="sobrenome"id="sobrenome">
         <div>

            <input type="email" name="email"id="email">
        </div>
    
        <label>De qual lado de aplicação você desenvolve?
            <br>
        </label>

            <input type="radio" name="devweb"value="frontend">front-end
            
        </label>
            <label>
                <input type="radio" name="backend"value=backend">back-end
            </label>
        <label>

        </label>
    </div>
    <label>Senioridade</label>
    <select id="Senioridade"
        <option>Junior</option>
        <option>Pleno</option>
        <option>Senior</option>
        <option>Junior</option>
      </select>
    </div>
   
    <fieldset>
         <div>
            <label>Selecione as tecnologias que voçê utiliza:</label><br><br>

        <input type="checkbox" name="tecnologias" value="HTML">
        HTML
    </label>

        <input type="checkbox" name="tecnologias" value="CSS">
        CSS
    </label>

    <label>
        <input type="checkbox" name="tecnologias" value="JavaScript">
        JavaScript
    </label>

    <label>
        <input type="checkbox" name="tecnologias" value="Python">
        Python
    </label>

    <label>
        <input type="checkbox" name="tecnologias" value="Git">

        <br><br>

    </form>
